<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCoder Settings</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h1 {
            color: #00d4aa;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 24px;
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
        }
        input:focus {
            outline: none;
            border-color: #00d4aa;
        }
        .hint {
            color: #666;
            font-size: 12px;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #00d4aa;
            color: #000;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #00b894;
        }
        .section {
            border-top: 1px solid #333;
            margin-top: 24px;
            padding-top: 24px;
        }
        .section h2 {
            font-size: 14px;
            color: #888;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VibeCoder</h1>
        <p class="subtitle">Configure your bridge connection</p>

        <div class="field">
            <label>Mac Hostname (Tailscale MagicDNS)</label>
            <input type="text" id="host" placeholder="macbook-pro">
            <p class="hint">Your Mac's name in Tailscale (e.g., macbook-pro, imac, mac-mini)</p>
        </div>

        <div class="field">
            <label>Bridge Port</label>
            <input type="number" id="port" placeholder="8080" value="8080">
            <p class="hint">Default: 8080 (only change if you modified the bridge)</p>
        </div>

        <div class="section">
            <h2>Future Settings</h2>

            <div class="field">
                <label>Project Directory</label>
                <input type="text" id="project_dir" placeholder="~/PebbleVibeProjects" value="~/PebbleVibeProjects">
                <p class="hint">Where new projects are created from watch</p>
            </div>
        </div>

        <button onclick="save()">Save Settings</button>
    </div>

    <script>
        // Parse URL params (existing config passed from pkjs)
        function getParam(name) {
            var match = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
            return match ? decodeURIComponent(match[1]) : null;
        }

        // Load existing config
        window.onload = function() {
            var host = getParam('host');
            var port = getParam('port');
            var project_dir = getParam('project_dir');

            if (host) document.getElementById('host').value = host;
            if (port) document.getElementById('port').value = port;
            if (project_dir) document.getElementById('project_dir').value = project_dir;
        };

        // Save and close
        function save() {
            var config = {
                host: document.getElementById('host').value || 'macbook-pro',
                port: parseInt(document.getElementById('port').value) || 8080,
                project_dir: document.getElementById('project_dir').value || '~/PebbleVibeProjects'
            };

            // Return to Pebble app with config
            var url = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(config));
            window.location.href = url;
        }
    </script>
</body>
</html>
